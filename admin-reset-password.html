<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Reset your Arablow JSS Academy staff password.">
<title>Reset Password | Arablow JSS Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.admin-page{min-height:100vh;padding:40px 20px;background:linear-gradient(135deg,#e0f2fe,#f8fafc);display:flex;align-items:center;justify-content:center}
.admin-shell{width:min(520px,100%)}.admin-card{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 12px 35px rgba(15,23,42,.08)}
.admin-head{padding:32px;background:linear-gradient(135deg,#075985,#053f5c);color:#fff}.admin-head h1{font-family:Poppins,sans-serif;font-size:26px;margin:10px 0}.admin-head p{color:#dbeafe;line-height:1.6;font-size:12px}
.admin-form{padding:32px}.admin-form h2{font-family:Poppins,sans-serif;color:var(--dark);font-size:22px}.admin-form>p{color:var(--muted);font-size:12px;line-height:1.6;margin:6px 0 22px}.admin-field{margin-bottom:16px}.admin-field label{display:block;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--dark)}.admin-field input{width:100%;height:46px;padding:0 13px;border:1px solid var(--border);border-radius:8px;font-size:12px;outline:0}.admin-field input:focus{border-color:#7dd3fc;box-shadow:0 0 0 3px #e0f2fe}
.admin-error,.admin-success{display:none;margin-bottom:15px;padding:11px;border-radius:8px;font-size:11px;line-height:1.5}.admin-error{background:#fef2f2;color:#991b1b}.admin-success{background:#f0fdf4;color:#166534}
.admin-back{display:inline-block;margin-top:18px;color:#075985;font-size:11px;font-weight:700}
@media(max-width:760px){.admin-page{padding:20px 14px}.admin-head,.admin-form{padding:28px}}
</style></head>
<body>
<div class="admin-page"><div class="admin-shell"><div class="admin-card">
<section class="admin-head"><span class="section-label light">ARABLOW JSS ACADEMY</span><h1>Staff Password Reset</h1><p>Use your authorised staff email to receive a secure password-reset link.</p></section>
<section class="admin-form"><h2>Forgot Password?</h2><p>Enter the email address connected to your Supabase staff account.</p>
<div class="admin-error" id="resetError"></div><div class="admin-success" id="resetSuccess"></div>
<form id="resetRequestForm"><div class="admin-field"><label for="resetEmail">Email</label><input id="resetEmail" type="email" placeholder="staff email" autocomplete="email" required></div>
<button id="resetButton" type="submit" class="btn btn-primary full-width">Send Reset Link</button></form>
<a class="admin-back" href="admin-login.html">← Back to admin login</a></section>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fyxtkccojxbucbkvvzss.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_TjVvQiZyWCc6MFkQB_isLQ_b3RaPItm";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const form=document.getElementById("resetRequestForm"), errorBox=document.getElementById("resetError"), successBox=document.getElementById("resetSuccess"), button=document.getElementById("resetButton");
function showError(msg){errorBox.textContent=msg;errorBox.style.display="block";successBox.style.display="none";}
form.addEventListener("submit",async e=>{
 e.preventDefault();errorBox.style.display="none";successBox.style.display="none";button.disabled=true;button.textContent="Sending...";
 try{
   const email=document.getElementById("resetEmail").value.trim();
   const redirectTo=window.location.origin+"/admin-reset-password.html";
   const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});
   if(error) throw error;
   successBox.textContent="If this email belongs to an authorised staff account, a password-reset link has been sent. Check your inbox and spam folder.";
   successBox.style.display="block";form.reset();
 }catch(err){console.error(err);showError(err.message||"Could not send the reset link. Please try again.");}
 finally{button.disabled=false;button.textContent="Send Reset Link";}
});
</script></body></html>
