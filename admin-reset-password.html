<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Create a new Arablow JSS Academy staff password.">
<title>Set New Password | Arablow JSS Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.admin-page{min-height:100vh;padding:40px 20px;background:linear-gradient(135deg,#e0f2fe,#f8fafc);display:flex;align-items:center;justify-content:center}
.admin-shell{width:min(520px,100%)}
.admin-card{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 12px 35px rgba(15,23,42,.08)}
.admin-head{padding:32px;background:linear-gradient(135deg,#075985,#053f5c);color:#fff}
.admin-head h1{font-family:Poppins,sans-serif;font-size:26px;margin:10px 0}
.admin-head p{color:#dbeafe;line-height:1.6;font-size:12px}
.admin-form{padding:32px}
.admin-form h2{font-family:Poppins,sans-serif;color:var(--dark);font-size:22px;margin:0 0 6px}
.admin-form>p{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 22px}
.admin-field{margin-bottom:16px}
.admin-field label{display:block;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--dark)}
.admin-field input{width:100%;height:46px;padding:0 13px;border:1px solid var(--border);border-radius:8px;font-size:12px;outline:0;box-sizing:border-box}
.admin-field input:focus{border-color:#7dd3fc;box-shadow:0 0 0 3px #e0f2fe}
.admin-error,.admin-success{display:none;margin-bottom:15px;padding:11px;border-radius:8px;font-size:11px;line-height:1.5}
.admin-error{background:#fef2f2;color:#991b1b}
.admin-success{background:#f0fdf4;color:#166534}
.admin-back{display:inline-block;margin-top:18px;color:#075985;font-size:11px;font-weight:700}
@media(max-width:760px){.admin-page{padding:20px 14px}.admin-head,.admin-form{padding:28px}}
</style>
</head>
<body>
<div class="admin-page">
  <div class="admin-shell">
    <div class="admin-card">
      <section class="admin-head">
        <span class="section-label light">ARABLOW JSS ACADEMY</span>
        <h1>Set New Password</h1>
        <p>Create a new secure password for your authorised staff account.</p>
      </section>
      <section class="admin-form">
        <h2>New Password</h2>
        <p>Enter your new password below and confirm it before saving.</p>
        <div class="admin-error" id="resetError"></div>
        <div class="admin-success" id="resetSuccess"></div>
        <form id="passwordForm">
          <div class="admin-field">
            <label for="newPassword">New Password</label>
            <input id="newPassword" type="password" placeholder="Enter new password" autocomplete="new-password" minlength="6" required>
          </div>
          <div class="admin-field">
            <label for="confirmPassword">Confirm New Password</label>
            <input id="confirmPassword" type="password" placeholder="Confirm new password" autocomplete="new-password" minlength="6" required>
          </div>
          <button id="updateButton" type="submit" class="btn btn-primary full-width">Update Password</button>
        </form>
        <a class="admin-back" href="admin-login.html">← Back to Admin Login</a>
      </section>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://fyxtkccojxbucbkvvzss.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_TjVvQiZyWCc6MFkQB_isLQ_b3RaPItm";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const form = document.getElementById("passwordForm");
const button = document.getElementById("updateButton");
const errorBox = document.getElementById("resetError");
const successBox = document.getElementById("resetSuccess");

function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = "block";
  successBox.style.display = "none";
}

function showSuccess(message) {
  successBox.textContent = message;
  successBox.style.display = "block";
  errorBox.style.display = "none";
}

async function checkRecoverySession() {
  try {
    const { data, error } = await supabaseClient.auth.getSession();
    if (error) throw error;

    if (!data.session) {
      showError("This password-reset link is invalid or has expired. Please request a new reset link.");
      button.disabled = true;
    }
  } catch (error) {
    console.error(error);
    showError(error.message || "Unable to verify the password-reset link.");
    button.disabled = true;
  }
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" && session) {
    button.disabled = false;
    errorBox.style.display = "none";
  }
});

form.addEventListener("submit", async event => {
  event.preventDefault();
  errorBox.style.display = "none";
  successBox.style.display = "none";

  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (newPassword.length < 6) {
    showError("Your new password must be at least 6 characters long.");
    return;
  }

  if (newPassword !== confirmPassword) {
    showError("The two passwords do not match.");
    return;
  }

  button.disabled = true;
  button.textContent = "Updating...";

  try {
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
    if (error) throw error;

    showSuccess("Your password has been updated successfully. Redirecting to Admin Login...");
    form.reset();

    setTimeout(async () => {
      await supabaseClient.auth.signOut();
      window.location.replace("admin-login.html");
    }, 1800);
  } catch (error) {
    console.error(error);
    showError(error.message || "Unable to update your password. Please request a new reset link.");
    button.disabled = false;
    button.textContent = "Update Password";
  }
});

checkRecoverySession();
</script>
</body>
</html>
