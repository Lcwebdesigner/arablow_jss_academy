<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Arablow JSS Academy staff dashboard."><title>Admin Dashboard | Arablow JSS Academy</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
<style>
.admin-dashboard{max-width:1180px;margin:0 auto;padding:28px 20px 50px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.admin-brand{display:flex;align-items:center;gap:10px}.admin-brand .logo-icon{background:#075985;color:#fff}.admin-brand strong{display:block;font-size:15px;color:var(--dark)}.admin-brand span{display:block;font-size:9px;color:#075985;font-weight:800;letter-spacing:1px}.admin-actions{display:flex;gap:8px;align-items:center}.admin-actions a,.admin-actions button{padding:9px 13px;border-radius:8px;font-size:10px;font-weight:800}.admin-actions a{background:#075985;color:#fff}.admin-actions button{border:1px solid var(--border);background:#fff;color:var(--text)}
.admin-welcome{padding:28px;border-radius:18px;background:linear-gradient(135deg,#075985,#053f5c);color:#fff;margin-bottom:20px}.admin-welcome h1{font-family:Poppins,sans-serif;font-size:28px;margin:7px 0}.admin-welcome p{color:#dbeafe;font-size:12px}.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.admin-stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px}.admin-stat span{display:block;color:var(--muted);font-size:10px;font-weight:700}.admin-stat strong{display:block;color:var(--dark);font-family:Poppins,sans-serif;font-size:28px;margin-top:4px}.admin-panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px}.admin-panel h2{font-family:Poppins,sans-serif;font-size:18px;color:var(--dark);margin-bottom:14px}.admin-search{width:100%;height:44px;padding:0 12px;border:1px solid var(--border);border-radius:8px;outline:0;margin-bottom:14px}.admin-table-wrap{overflow-x:auto}.admin-table{width:100%;border-collapse:collapse;font-size:11px;min-width:620px}.admin-table th,.admin-table td{text-align:left;padding:11px 9px;border-bottom:1px solid #e2e8f0}.admin-table th{color:#475569;background:#f8fafc;font-size:10px}.admin-table td{color:#334155}.status{display:inline-block;padding:4px 7px;border-radius:20px;background:#e0f2fe;color:#075985;font-weight:700}.result-card{border-bottom:1px solid #e2e8f0;padding:12px 0}.result-card:last-child{border-bottom:0}.result-card strong{font-size:12px;color:var(--dark)}.result-card span{font-size:10px;color:var(--muted)}.empty{padding:14px;border-radius:9px;background:#f8fafc;color:var(--muted);font-size:11px}
@media(max-width:760px){.admin-dashboard{padding:20px 14px}.admin-top{align-items:flex-start;flex-direction:column}.admin-actions{width:100%}.admin-actions a,.admin-actions button{flex:1;text-align:center}.admin-stats{grid-template-columns:1fr}.admin-welcome h1{font-size:24px}}
</style></head><body>
<main class="admin-dashboard"><div class="admin-top"><a href="index.html" class="admin-brand"><div class="logo-icon">L</div><div><strong>ARABLOW JUNIOR SCHOOL</strong><span>STAFF PORTAL</span></div></a><div class="admin-actions"><a href="index.html">Main Website</a><button id="logoutBtn">Logout</button></div></div>
<section class="admin-welcome"><span class="section-label light">ADMIN DASHBOARD</span><h1>Welcome, <span id="adminName">Teacher</span></h1><p>Role: <strong id="adminRole">teacher</strong> • Manage learners and examination performance.</p></section>
<section class="admin-stats"><div class="admin-stat"><span>REGISTERED STUDENTS</span><strong id="studentCount">—</strong></div><div class="admin-stat"><span>EXAM RESULTS</span><strong id="resultCount">—</strong></div><div class="admin-stat"><span>AUTHORISED STAFF</span><strong>1</strong></div></section>
<section class="admin-panel"><h2>Grade 7 Students</h2><input id="studentSearch" class="admin-search" placeholder="Search by name, admission number or email..."><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Admission No.</th><th>Email</th><th>Class</th></tr></thead><tbody id="studentsBody"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></section>
<section class="admin-panel"><h2>Recent Examination Results</h2><div id="resultsBox" class="empty">Loading...</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://fyxtkccojxbucbkvvzss.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_TjVvQiZyWCc6MFkQB_isLQ_b3RaPItm";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let students=[];
async function init(){const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();if(sessionError||!session){location.replace("admin-login.html");return;}const {data:profile,error:profileError}=await supabaseClient.from("admin_profiles").select("full_name,role").eq("auth_user_id",session.user.id).maybeSingle();if(profileError||!profile){await supabaseClient.auth.signOut();location.replace("admin-login.html");return;}document.getElementById("adminName").textContent=profile.full_name;document.getElementById("adminRole").textContent=profile.role;await loadStudents();await loadResults();}
async function loadStudents(){const {data,error}=await supabaseClient.from("students").select("full_name,admission_no,email,class").eq("class","Grade 7").order("full_name");if(error){document.getElementById("studentsBody").innerHTML='<tr><td colspan="4">Unable to load students.</td></tr>';return;}students=data||[];document.getElementById("studentCount").textContent=students.length;renderStudents(students);}
function renderStudents(list){document.getElementById("studentsBody").innerHTML=list.length?list.map(s=>`<tr><td><strong>${esc(s.full_name)}</strong></td><td><span class="status">${esc(s.admission_no)}</span></td><td>${esc(s.email)}</td><td>${esc(s.class)}</td></tr>`).join(""): '<tr><td colspan="4">No students found.</td></tr>';}
async function loadResults(){const {data,error}=await supabaseClient.from("exam_results").select("student_name,admission_no,subject,grade,score,total_questions,percentage,created_at").order("created_at",{ascending:false}).limit(50);if(error){document.getElementById("resultsBox").textContent="Unable to load examination results.";return;}document.getElementById("resultCount").textContent=(data||[]).length;const box=document.getElementById("resultsBox");if(!data||!data.length){box.textContent="No examination results have been submitted yet.";return;}box.className="";box.innerHTML=data.map(r=>`<div class="result-card"><strong>${esc(r.student_name||r.admission_no)} — ${esc(r.subject)}</strong><br><span>${esc(r.admission_no)} • ${r.score}/${r.total_questions} (${r.percentage}%) • ${esc(r.grade)} • ${new Date(r.created_at).toLocaleDateString()}</span></div>`).join("");}
function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
document.getElementById("studentSearch").addEventListener("input",e=>{const q=e.target.value.toLowerCase().trim();renderStudents(students.filter(s=>[s.full_name,s.admission_no,s.email].join(" ").toLowerCase().includes(q)));});
document.getElementById("logoutBtn").addEventListener("click",async()=>{await supabaseClient.auth.signOut();["arablow_admin_name","arablow_admin_role","arablow_admin_auth_user_id"].forEach(k=>localStorage.removeItem(k));location.replace("admin-login.html");});
init();
</script></body></html>
