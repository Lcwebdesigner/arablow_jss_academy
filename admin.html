<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard | Arablow JSS Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#075985;--primary-dark:#053f5c;--light:#f8fafc;--dark:#0f172a;--text:#334155;--muted:#64748b;--border:#e2e8f0;--success:#166534;--success-bg:#f0fdf4;--danger:#991b1b;--danger-bg:#fef2f2}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:var(--light);color:var(--text);line-height:1.6}.page{min-height:100vh;padding:24px}.shell{width:min(1150px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:var(--primary);color:#fff;font:800 21px Poppins}.brand strong{display:block;color:var(--dark);font:700 16px Poppins}.brand span{display:block;color:var(--primary);font-size:9px;font-weight:800;letter-spacing:1px}.actions{display:flex;gap:8px}.actions a,.actions button{padding:9px 13px;border-radius:8px;font-size:10px;font-weight:800;text-decoration:none}.actions a{background:var(--primary);color:#fff}.actions button{border:1px solid var(--border);background:#fff;color:var(--text)}.welcome{padding:25px;border-radius:17px;background:linear-gradient(135deg,#075985,#053f5c);color:#fff;margin-bottom:20px}.welcome .label{color:#bae6fd;font-size:10px;font-weight:800;letter-spacing:1.4px}.welcome h1{margin-top:4px;font:700 28px Poppins}.welcome p{color:#dbeafe;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}.stat{padding:20px;background:#fff;border:1px solid var(--border);border-radius:14px}.stat span{color:var(--muted);font-size:10px;font-weight:700}.stat strong{display:block;margin-top:3px;color:var(--dark);font:700 25px Poppins}.panel{padding:22px;background:#fff;border:1px solid var(--border);border-radius:15px;margin-bottom:20px}.panel h2{margin-bottom:15px;color:var(--dark);font:700 18px Poppins}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{height:42px;padding:0 11px;border:1px solid var(--border);border-radius:8px;background:#fff;outline:0;font-size:11px}.toolbar input{flex:1;min-width:180px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--border);font-size:10px}th{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.6px}td strong{color:var(--dark)}.empty,.loading{padding:16px;border-radius:9px;background:var(--light);color:var(--muted);font-size:11px}.error{padding:12px;border-radius:9px;background:var(--danger-bg);color:var(--danger);font-size:11px;margin-bottom:15px}.success{padding:12px;border-radius:9px;background:var(--success-bg);color:var(--success);font-size:11px;margin-bottom:15px}.badge{display:inline-block;padding:4px 7px;border-radius:6px;background:#e0f2fe;color:#075985;font-size:9px;font-weight:800}
@media(max-width:700px){.page{padding:15px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions a,.actions button{flex:1;text-align:center}.stats{grid-template-columns:1fr}.welcome h1{font-size:24px}}
</style>
</head>
<body>
<div class="page"><div class="shell">
<header class="top"><div class="brand"><div class="logo">A</div><div><strong>ARABLOW JUNIOR SCHOOL</strong><span>TEACHER / ADMIN PORTAL</span></div></div><div class="actions"><a href="index.html">Main Website</a><button id="logoutBtn">Logout</button></div></header>
<section class="welcome"><div class="label">STAFF DASHBOARD</div><h1>Welcome, <span id="teacherName">Teacher</span></h1><p>Manage Grade 7 students and review examination results.</p></section>
<div id="pageError" class="error" style="display:none"></div>
<section class="stats"><div class="stat"><span>REGISTERED GRADE 7 STUDENTS</span><strong id="studentCount">—</strong></div><div class="stat"><span>EXAMINATIONS SUBMITTED</span><strong id="resultCount">—</strong></div><div class="stat"><span>AVERAGE SCORE</span><strong id="averageScore">—</strong></div></section>
<section class="panel"><h2>Grade 7 Students</h2><div class="toolbar"><input id="studentSearch" placeholder="Search name or admission number"><button id="refreshStudents" style="height:42px;padding:0 13px;border:0;border-radius:8px;background:#075985;color:#fff;font-size:10px;font-weight:800">Refresh</button></div><div id="studentsBox" class="loading">Loading students...</div></section>
<section class="panel"><h2>Examination Results</h2><div class="toolbar"><input id="resultSearch" placeholder="Search student, admission number or subject"><select id="subjectFilter"><option value="">All subjects</option></select></div><div id="resultsBox" class="loading">Loading results...</div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fyxtkccojxbucbkvvzss.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_TjVvQiZyWCc6MFkQB_isLQ_b3RaPItm";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let students=[],results=[];
const $=id=>document.getElementById(id);
function esc(value){return String(value??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
function showError(msg){$("pageError").textContent=msg;$("pageError").style.display="block"}
async function requireAdmin(){
 const {data:{session},error}=await supabaseClient.auth.getSession();
 if(error||!session?.user){location.replace("admin-login.html");return null}
 const {data:admin,error:adminError}=await supabaseClient.from("admin_profiles").select("full_name,role").eq("auth_user_id",session.user.id).maybeSingle();
 if(adminError||!admin){await supabaseClient.auth.signOut();location.replace("admin-login.html");return null}
 $("teacherName").textContent=admin.full_name||"Teacher";
 return session.user;
}
function renderStudents(){
 const q=$("studentSearch").value.trim().toLowerCase();
 const filtered=students.filter(s=>`${s.full_name} ${s.admission_no} ${s.email}`.toLowerCase().includes(q));
 if(!filtered.length){$("studentsBox").className="empty";$("studentsBox").textContent="No students found.";return}
 $("studentsBox").className="table-wrap";$("studentsBox").innerHTML=`<table><thead><tr><th>Name</th><th>Admission</th><th>Email</th><th>Class</th><th>Registered</th></tr></thead><tbody>${filtered.map(s=>`<tr><td><strong>${esc(s.full_name)}</strong></td><td>${esc(s.admission_no)}</td><td>${esc(s.email)}</td><td><span class="badge">${esc(s.class)}</span></td><td>${new Date(s.created_at).toLocaleDateString()}</td></tr>`).join("")}</tbody></table>`;
}
function renderResults(){
 const q=$("resultSearch").value.trim().toLowerCase(),subject=$("subjectFilter").value;
 const filtered=results.filter(r=>`${r.student_name} ${r.admission_no} ${r.subject}`.toLowerCase().includes(q)&&(!subject||r.subject===subject));
 if(!filtered.length){$("resultsBox").className="empty";$("resultsBox").textContent="No examination results found.";return}
 $("resultsBox").className="table-wrap";$("resultsBox").innerHTML=`<table><thead><tr><th>Student</th><th>Admission</th><th>Subject</th><th>Score</th><th>Percentage</th><th>Date</th></tr></thead><tbody>${filtered.map(r=>`<tr><td><strong>${esc(r.student_name||"Student")}</strong></td><td>${esc(r.admission_no)}</td><td>${esc(r.subject)}</td><td>${esc(r.score)}/${esc(r.total_questions)}</td><td><span class="badge">${esc(r.percentage)}%</span></td><td>${new Date(r.created_at).toLocaleDateString()}</td></tr>`).join("")}</tbody></table>`;
}
async function loadData(){
 $("studentsBox").className="loading";$("studentsBox").textContent="Loading students...";
 $("resultsBox").className="loading";$("resultsBox").textContent="Loading results...";$("pageError").style.display="none";
 const [studentsResponse,resultsResponse]=await Promise.all([
  supabaseClient.from("students").select("full_name,admission_no,email,class,created_at").eq("class","Grade 7").order("created_at",{ascending:false}),
  supabaseClient.from("exam_results").select("student_name,admission_no,subject,grade,score,total_questions,percentage,created_at").eq("grade","Grade 7").order("created_at",{ascending:false})
 ]);
 if(studentsResponse.error){showError("Could not load students: "+studentsResponse.error.message);students=[]}else students=studentsResponse.data||[];
 if(resultsResponse.error){showError("Could not load results: "+resultsResponse.error.message);results=[]}else results=resultsResponse.data||[];
 $("studentCount").textContent=students.length;$("resultCount").textContent=results.length;
 const avg=results.length?results.reduce((sum,r)=>sum+Number(r.percentage||0),0)/results.length:0;$("averageScore").textContent=results.length?avg.toFixed(1)+"%":"—";
 const subjects=[...new Set(results.map(r=>r.subject).filter(Boolean))].sort();$("subjectFilter").innerHTML='<option value="">All subjects</option>'+subjects.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("");
 renderStudents();renderResults();
}
$("studentSearch").addEventListener("input",renderStudents);$("resultSearch").addEventListener("input",renderResults);$("subjectFilter").addEventListener("change",renderResults);$("refreshStudents").addEventListener("click",loadData);
$("logoutBtn").addEventListener("click",async()=>{await supabaseClient.auth.signOut();location.replace("admin-login.html")});
(async()=>{const user=await requireAdmin();if(user)await loadData()})();
</script>
</body>
</html>
