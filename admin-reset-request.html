<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Reset your Arablow JSS Academy staff password.">
<title>Forgot Password | Arablow JSS Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.reset-page{min-height:100vh;padding:20px;background:linear-gradient(135deg,#e0f2fe,#f8fafc);display:flex;align-items:center;justify-content:center}
.reset-card{width:min(480px,100%);background:#fff;border:1px solid var(--border);border-radius:20px;padding:36px;box-shadow:0 12px 35px rgba(15,23,42,.08)}
.reset-card h1{font-family:Poppins,sans-serif;color:var(--dark);font-size:25px;margin:0 0 8px}.reset-card>p{color:var(--muted);font-size:12px;line-height:1.7;margin-bottom:24px}
.reset-field{margin-bottom:16px}.reset-field label{display:block;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--dark)}.reset-field input{width:100%;height:46px;padding:0 13px;border:1px solid var(--border);border-radius:8px;font-size:12px;outline:0}.reset-field input:focus{border-color:#7dd3fc;box-shadow:0 0 0 3px #e0f2fe}
.reset-error{display:none;margin-bottom:15px;padding:11px;border-radius:8px;background:#fef2f2;color:#991b1b;font-size:11px}.reset-success{display:none;margin-bottom:15px;padding:11px;border-radius:8px;background:#f0fdf4;color:#166534;font-size:11px}
.reset-back{display:inline-block;margin-top:18px;color:#075985;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="reset-page">
<div class="reset-card">
<span class="section-label">ARABLOW JSS ACADEMY</span>
<h1>Reset Admin Password</h1>
<p>Enter the email address for your authorised staff account. We will send you a secure password-reset link.</p>

<div class="reset-error" id="resetError"></div>
<div class="reset-success" id="resetSuccess"></div>

<form id="resetForm">
<div class="reset-field">
<label for="resetEmail">Staff Email</label>
<input id="resetEmail" type="email" placeholder="staff email" autocomplete="email" required>
</div>
<button id="resetButton" type="submit" class="btn btn-primary full-width">Send Reset Link</button>
</form>

<a class="reset-back" href="admin-login.html">← Back to Admin Login</a>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fyxtkccojxbucbkvvzss.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_TjVvQiZyWCc6MFkQB_isLQ_b3RaPItm";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const form=document.getElementById("resetForm");
const button=document.getElementById("resetButton");
const errorBox=document.getElementById("resetError");
const successBox=document.getElementById("resetSuccess");

function showError(msg){
  errorBox.textContent=msg;
  errorBox.style.display="block";
  successBox.style.display="none";
}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  errorBox.style.display="none";
  successBox.style.display="none";
  button.disabled=true;
  button.textContent="Sending...";

  try{
    const email=document.getElementById("resetEmail").value.trim();
    const redirectTo=window.location.origin + "/admin-reset-password.html";

    const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});
    if(error) throw error;

    successBox.textContent="If this email belongs to an authorised staff account, a password-reset link has been sent. Check your email inbox and spam folder.";
    successBox.style.display="block";
    form.reset();
  }catch(err){
    console.error(err);
    showError(err.message||"Unable to send the reset link. Please try again.");
  }finally{
    button.disabled=false;
    button.textContent="Send Reset Link";
  }
});
</script>
</body>
</html>
